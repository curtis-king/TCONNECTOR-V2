name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests unitaires (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connecteur-python

    steps:
      - uses: actions/checkout@v4

      # pyodbc importe unixODBC même lorsque aucun serveur Sage n'est joignable.
      - name: Installer unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            connecteur-python/requirements.txt
            connecteur-python/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      # config.json est gitignoré : on part de l'exemple versionné.
      # tests/conftest.py neutralise de toute façon la connexion Sage.
      - name: Préparer la configuration de test
        run: cp config.example.json config.json

      - name: Tests
        # Plancher de non-régression : 50 % sur app/sync + app/integration
        # (mesuré à 50,1 % le 2026-11-23). Cible du plan : 60 %, à relever
        # progressivement. Le rapport XML est conservé en artefact.
        run: |
          python -m pytest tests --ignore=tests/perf \
            -m "not sandbox and not integration" \
            --cov=app.sync --cov=app.integration \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=50

      - name: Téléverser le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-app-sync-integration
          path: connecteur-python/coverage.xml
          if-no-files-found: ignore

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connecteur-python

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Installer ruff
        run: pip install "ruff>=0.9"

      # Bloquant : uniquement les erreurs de correction (nom indéfini,
      # syntaxe invalide, import cassé). Le legacy passe déjà ces règles.
      - name: Erreurs bloquantes
        run: ruff check --select E9,F63,F7,F82 app tests scripts

      # Non bloquant : style du legacy, corrigé progressivement. Le seuil du
      # plan (« diff uniquement ») est appliqué en revue ; la CI se contente
      # de rapporter pour ne pas bloquer sur du code non touché.
      - name: Style (informatif)
        continue-on-error: true
        run: ruff check app tests scripts

  audit:
    name: Audit dépendances
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connecteur-python
    # Non bloquant au démarrage : les vulnérabilités du legacy sont traitées
    # dans un lot dédié, sans bloquer les correctifs en cours.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit -r requirements.txt
      - run: pip-audit -r requirements.txt
