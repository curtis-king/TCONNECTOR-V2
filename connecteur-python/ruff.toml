# Configuration Ruff volontairement minimale et stable : le jeu de règles par
# défaut de Ruff évolue entre versions, on fige donc la sélection.
#
# - E4/E7/E9 : imports, instructions, erreurs de syntaxe ;
# - F        : pyflakes (noms indéfinis, imports inutilisés, redéfinitions).
#
# La CI bloque uniquement sur E9/F63/F7/F82 (voir .github/workflows/ci.yml) ;
# le reste est rapporté sans bloquer tant que le legacy n'est pas nettoyé.
target-version = "py314"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
